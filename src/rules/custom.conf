SecRule REQUEST_URI "@contains /admin" \
    "id:1001,phase:1,deny,status:403"

SecRule REQUEST_HEADERS:User-Agent "@contains BadBot" \
    "id:1002,phase:1,deny,status:403"

SecRule ARGS:username "@streq admin" \
    "id:1005,phase:2,deny,status:403,log"

SecRule REQUEST_URI "@streq /old" \
    "id:1004,phase:1,redirect:'https://example.com/new',status:302"


